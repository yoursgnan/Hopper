<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hopper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Primary Float Tile (Android 17 Mint/Sage Tonal Container) */
      --tile-primary-bg: #d7eed9;
      --tile-primary-border: rgba(142, 212, 154, 0.5);
      --tile-primary-text: #0b3519;
      --tile-primary-subtext: #315e3f;
      --tile-primary-icon-bg: #98dfaa;
      --tile-primary-icon-color: #082813;
      
      /* Secondary Support Tile (Translucent Glass Tonal Surface) */
      --tile-secondary-bg: rgba(255, 255, 255, 0.85);
      --tile-secondary-border: rgba(0, 0, 0, 0.06);
      --tile-secondary-text: #1d211e;
      --tile-secondary-subtext: #636b65;
      --tile-secondary-icon-bg: #ffe4e6;
      --tile-secondary-icon-color: #e11d48;
      
      --radius-tile: 24px;
      --radius-icon: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 280px;
      margin: 0;
      padding: 0;
      background: #f8faf9;
      background-image: 
        radial-gradient(110% 110% at 90% 10%, rgba(185, 238, 201, 0.5) 0%, rgba(248, 250, 249, 0) 65%),
        radial-gradient(100% 100% at 10% 90%, rgba(255, 228, 230, 0.4) 0%, rgba(248, 250, 249, 0) 60%);
      color: #191c1e;
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body {
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Minimal Clean Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #191c1e;
    }

    /* Actions Stack */
    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Android 17 Tactile Tile Button Base */
    .a17-tile-button {
      width: 100%;
      border-radius: var(--radius-tile);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-family: var(--font-family);
      text-align: left;
      border: 1px solid transparent;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .a17-tile-button:active {
      transform: scale(0.965);
    }

    /* Tile 1: Float Tab (Android 17 Mint Tonal Tile) */
    .tile-float {
      background: var(--tile-primary-bg);
      border-color: var(--tile-primary-border);
      color: var(--tile-primary-text);
      box-shadow: 
        0 4px 16px rgba(152, 223, 170, 0.35),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.6);
    }

    .tile-float:hover {
      background: #c8e7cb;
      transform: translateY(-2px);
      box-shadow: 
        0 8px 24px rgba(152, 223, 170, 0.5),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.8);
    }

    .tile-float-icon-box {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-icon);
      background: var(--tile-primary-icon-bg);
      color: var(--tile-primary-icon-color);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(8, 40, 19, 0.15);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tile-float:hover .tile-float-icon-box {
      transform: scale(1.08);
    }

    .tile-float-icon-box svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .tile-text-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .tile-title-float {
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--tile-primary-text);
      line-height: 1.2;
    }

    .tile-subtitle-float {
      font-size: 11px;
      font-weight: 600;
      color: var(--tile-primary-subtext);
    }

    .tile-arrow-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(8, 40, 19, 0.08);
      color: var(--tile-primary-icon-color);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .tile-float:hover .tile-arrow-circle {
      background: var(--tile-primary-icon-bg);
      transform: translateX(2px);
    }

    .tile-arrow-circle svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Tile 2: Support (Android 17 Translucent Glass Tile) */
    .tile-support {
      background: var(--tile-secondary-bg);
      border-color: var(--tile-secondary-border);
      color: var(--tile-secondary-text);
      box-shadow: 
        0 4px 14px rgba(0, 0, 0, 0.04),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
    }

    .tile-support:hover {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(0, 0, 0, 0.1);
      transform: translateY(-1px);
      box-shadow: 
        0 6px 18px rgba(0, 0, 0, 0.07),
        inset 0 1px 1.5px rgba(255, 255, 255, 1);
    }

    .tile-support-icon-box {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-icon);
      background: var(--tile-secondary-icon-bg);
      color: var(--tile-secondary-icon-color);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(225, 29, 72, 0.12);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tile-support:hover .tile-support-icon-box {
      transform: scale(1.1);
    }

    .tile-support-icon-box svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .tile-title-support {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--tile-secondary-text);
      line-height: 1.2;
    }

    .tile-subtitle-support {
      font-size: 11px;
      font-weight: 500;
      color: var(--tile-secondary-subtext);
    }

    /* Android 17 Translucent Modal Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 10px;
    }

    .modal-overlay.open {
      display: flex;
      animation: sheetUp 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes sheetUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .modal-handle {
      width: 32px;
      height: 4px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 2px;
      align-self: center;
      margin-bottom: 2px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
      color: #191c1e;
    }

    .modal-close {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.06);
      border: none;
      color: #5f6368;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
    }

    .modal-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border-radius: 16px;
      background: #f1f5f2;
      border: 1px solid rgba(0, 0, 0, 0.04);
      text-decoration: none;
      color: #191c1e;
      font-size: 12.5px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .link-item:hover {
      background: #e2f0e4;
      transform: translateX(2px);
    }

    .link-item svg {
      width: 14px;
      height: 14px;
      fill: #315e3f;
    }
  </style>
</head>
<body>

  <!-- Minimal Header with Grasshopper Brand Icon -->
  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <img src="icons/icon32.png" width="24" height="24" style="display: block; object-fit: contain;" alt="Hopper">
      <span class="brand-title">Hopper</span>
    </div>
  </header>

  <!-- The 2 Android 17 Soft-Cornered Tile Buttons -->
  <main class="actions-stack">
    
    <!-- Button 1: Float Tab (Android 17 Mint Tonal Tile) -->
    <button class="a17-tile-button tile-float" id="btn-float-tab" type="button">
      <div class="tile-float-icon-box">
        <!-- Picture in Picture Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.99h18v14.02z"/>
        </svg>
      </div>
      <div class="tile-text-wrap">
        <span class="tile-title-float">Float Tab</span>
        <span class="tile-subtitle-float">Picture-in-Picture window</span>
      </div>
      <div class="tile-arrow-circle">
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
      </div>
    </button>

    <!-- Button 2: Support (Android 17 Translucent Glass Tile) -->
    <button class="a17-tile-button tile-support" id="btn-support" type="button">
      <div class="tile-support-icon-box">
        <!-- Heart Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <div class="tile-text-wrap">
        <span class="tile-title-support">Support</span>
        <span class="tile-subtitle-support">Feedback & reviews</span>
      </div>
    </button>

  </main>

  <!-- Translucent Support Modal Sheet -->
  <div class="modal-overlay" id="support-modal">
    <div class="modal-card">
      <div class="modal-handle"></div>
      <div class="modal-head">
        <span class="modal-title">Support Hopper</span>
        <button class="modal-close" id="modal-close-btn" type="button">✕</button>
      </div>
      <div class="modal-links">
        <a class="link-item" href="https://github.com" target="_blank">
          <span>⭐ Star on GitHub</span>
          <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
        </a>
        <a class="link-item" href="https://chrome.google.com/webstore" target="_blank">
          <span>💬 Write a Review</span>
          <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
        </a>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
